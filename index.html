<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<title>Impulse Reset</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface-2: #232323;
    --border: #2a2a2a;
    --accent: #c8f060;
    --accent-dim: #b0d840;
    --warn: #ff8a5b;
    --text: #e8e8e8;
    --muted: #666;
    --muted-2: #888;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    padding: 24px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .date-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
  }

  h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .mode-toggle {
    display: flex;
    margin: 18px 24px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    gap: 4px;
  }

  .mode-btn {
    flex: 1;
    padding: 10px 12px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--muted-2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.15s;
    -webkit-appearance: none;
  }

  .mode-btn.active {
    background: var(--surface-2);
    color: var(--accent);
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 22px 24px 10px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 24px;
  }

  .input-area {
    flex: 1;
    padding: 16px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 300;
    line-height: 1.6;
    padding: 16px;
    resize: none;
    outline: none;
    min-height: 140px;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea:disabled {
    background: var(--surface-2);
    color: var(--muted-2);
    cursor: default;
  }

  textarea::placeholder {
    color: var(--muted);
    font-style: italic;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    line-height: 1.7;
    background: var(--surface);
    border-radius: 8px;
    padding: 12px 14px;
    border-left: 2px solid var(--border);
  }

  .hint span {
    color: var(--accent);
  }

  .timer-card {
    margin: 16px 24px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 18px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .timer-card.visible { display: flex; }
  .timer-card.ready { border-color: var(--accent); }

  .timer-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .timer-display {
    font-family: 'DM Mono', monospace;
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 0.05em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .timer-card.ready .timer-display { color: var(--accent); }

  .timer-sub {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .actions {
    padding: 18px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button.action {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: all 0.15s;
    -webkit-appearance: none;
  }

  .btn-primary {
    background: var(--accent);
    color: #0f0f0f;
  }

  .btn-primary:active { transform: scale(0.98); background: var(--accent-dim); }

  .btn-primary:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
    transform: none;
  }

  .btn-secondary {
    background: var(--surface);
    color: var(--muted-2);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .btn-secondary:active { background: var(--border); }

  .btn-warn {
    background: transparent;
    color: var(--warn);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .btn-warn:active { background: rgba(255, 138, 91, 0.08); }

  .history {
    margin: 8px 24px 0;
    padding-bottom: 8px;
  }

  .history-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .history-meta {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
  }

  .history-meta .mode-tag {
    color: var(--accent);
    text-transform: uppercase;
  }

  .history-text {
    font-size: 13px;
    color: var(--text);
    font-weight: 300;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .history-empty {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 12px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #0f0f0f;
    padding: 12px 24px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    z-index: 100;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="date-label" id="dateLabel"></div>
  <h1>Impulse Reset</h1>
</header>

<div class="mode-toggle" role="tablist">
  <button class="mode-btn" data-mode="habit" role="tab">Habit</button>
  <button class="mode-btn" data-mode="shopping" role="tab">Shopping</button>
</div>

<div class="section-label" id="sectionLabel"></div>
<div class="divider"></div>

<div class="input-area">
  <textarea id="input" rows="6"></textarea>
  <div class="hint" id="hint"></div>
</div>

<div class="timer-card" id="timerCard">
  <div class="timer-label" id="timerLabelText">20-min hold</div>
  <div class="timer-display" id="timerDisplay">20:00</div>
  <div class="timer-sub" id="timerSub">urge will pass</div>
</div>

<div class="actions">
  <button class="action btn-primary" id="primaryBtn" disabled>Start 20-min hold</button>
  <button class="action btn-secondary" id="secondaryBtn" style="display:none;">Clear</button>
</div>

<div class="history">
  <div class="history-title">Recent · last 3</div>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast">Opening Obsidian…</div>

<script>
  // ---------- Config ----------
  const VAULT = 'LifeOS_mobile';
  const HOLD_MS = 20 * 60 * 1000; // 20 minutes
  const STORAGE_KEY = 'hr_v4';
  const HISTORY_MAX = 3;

  const MODE_CONFIG = {
    habit: {
      label: 'Habit',
      heading: 'Habit',
      sectionLabel: '→ ## Habit · LifeOS_mobile',
      placeholder: '何の衝動？ いま何を感じてる？',
      hint: '<span>What</span> / <span>Where</span> / <span>Body</span><br>衝動の対象・場面・体感を1行ずつ',
    },
    shopping: {
      label: 'Shopping',
      heading: 'Shopping',
      sectionLabel: '→ ## Shopping · LifeOS_mobile · Week1 Observe',
      placeholder: '何が欲しい？ なぜ今？',
      hint: '<span>Item</span> / <span>Trigger</span> / <span>Need</span><br>買わずに記録だけ・1行ずつ',
    },
  };

  // ---------- State ----------
  function defaultState() {
    return {
      draft: { habit: '', shopping: '' },
      timer: { habit: null, shopping: null },
      lastMode: 'habit',
      history: [],
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const s = defaultState();
      if (parsed && typeof parsed === 'object') {
        if (parsed.draft) Object.assign(s.draft, parsed.draft);
        if (parsed.timer) Object.assign(s.timer, parsed.timer);
        if (parsed.lastMode === 'habit' || parsed.lastMode === 'shopping') s.lastMode = parsed.lastMode;
        if (Array.isArray(parsed.history)) s.history = parsed.history.slice(0, HISTORY_MAX);
      }
      return s;
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* quota — ignore */ }
  }

  let state = loadState();
  let currentMode = state.lastMode;
  let tickHandle = null;

  // ---------- Date helpers ----------
  function getToday() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function formatDateLabel(dateStr) {
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const d = new Date(dateStr + 'T00:00:00');
    return `${dateStr} · ${days[d.getDay()]}`;
  }

  function formatRemaining(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const mm = String(Math.floor(total / 60)).padStart(2, '0');
    const ss = String(total % 60).padStart(2, '0');
    return `${mm}:${ss}`;
  }

  function formatHistoryTime(ts) {
    const d = new Date(ts);
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    if (sameDay) return `${hh}:${mm}`;
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${mo}-${dd} ${hh}:${mm}`;
  }

  // ---------- DOM refs ----------
  const dateLabelEl = document.getElementById('dateLabel');
  const sectionLabelEl = document.getElementById('sectionLabel');
  const textareaEl = document.getElementById('input');
  const hintEl = document.getElementById('hint');
  const timerCardEl = document.getElementById('timerCard');
  const timerDisplayEl = document.getElementById('timerDisplay');
  const timerSubEl = document.getElementById('timerSub');
  const timerLabelEl = document.getElementById('timerLabelText');
  const primaryBtnEl = document.getElementById('primaryBtn');
  const secondaryBtnEl = document.getElementById('secondaryBtn');
  const historyListEl = document.getElementById('historyList');
  const modeBtns = Array.from(document.querySelectorAll('.mode-btn'));

  dateLabelEl.textContent = formatDateLabel(getToday());

  // ---------- Phase ----------
  // Returns 'idle' | 'holding' | 'ready' for the active mode
  function currentPhase() {
    const t = state.timer[currentMode];
    if (!t) return 'idle';
    const remaining = HOLD_MS - (Date.now() - t.startedAt);
    return remaining > 0 ? 'holding' : 'ready';
  }

  // ---------- Render ----------
  function render() {
    const cfg = MODE_CONFIG[currentMode];
    sectionLabelEl.textContent = cfg.sectionLabel;
    textareaEl.placeholder = cfg.placeholder;
    hintEl.innerHTML = cfg.hint;

    modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));

    const phase = currentPhase();
    const t = state.timer[currentMode];

    if (phase === 'idle') {
      textareaEl.value = state.draft[currentMode] || '';
      textareaEl.disabled = false;
      timerCardEl.classList.remove('visible', 'ready');
      primaryBtnEl.textContent = 'Start 20-min hold';
      primaryBtnEl.disabled = !textareaEl.value.trim();
      primaryBtnEl.dataset.action = 'start';
      primaryBtnEl.className = 'action btn-primary';
      secondaryBtnEl.style.display = textareaEl.value.trim() ? 'block' : 'none';
      secondaryBtnEl.textContent = 'Clear';
      secondaryBtnEl.className = 'action btn-secondary';
      secondaryBtnEl.dataset.action = 'clear';
    } else if (phase === 'holding') {
      textareaEl.value = t.text;
      textareaEl.disabled = true;
      timerCardEl.classList.add('visible');
      timerCardEl.classList.remove('ready');
      timerLabelEl.textContent = '20-min hold · ' + cfg.label;
      timerDisplayEl.textContent = formatRemaining(HOLD_MS - (Date.now() - t.startedAt));
      timerSubEl.textContent = 'urge will pass';
      primaryBtnEl.textContent = 'Holding…';
      primaryBtnEl.disabled = true;
      primaryBtnEl.dataset.action = 'noop';
      primaryBtnEl.className = 'action btn-primary';
      secondaryBtnEl.style.display = 'block';
      secondaryBtnEl.textContent = 'Cancel hold';
      secondaryBtnEl.className = 'action btn-warn';
      secondaryBtnEl.dataset.action = 'cancel';
    } else { // ready
      textareaEl.value = t.text;
      textareaEl.disabled = false;
      timerCardEl.classList.add('visible', 'ready');
      timerLabelEl.textContent = 'Hold complete · ' + cfg.label;
      timerDisplayEl.textContent = '00:00';
      timerSubEl.textContent = 'still want to act on it?';
      primaryBtnEl.textContent = `Send to Obsidian · ## ${cfg.heading}`;
      primaryBtnEl.disabled = !textareaEl.value.trim();
      primaryBtnEl.dataset.action = 'send';
      primaryBtnEl.className = 'action btn-primary';
      secondaryBtnEl.style.display = 'block';
      secondaryBtnEl.textContent = 'Discard';
      secondaryBtnEl.className = 'action btn-warn';
      secondaryBtnEl.dataset.action = 'discard';
    }

    renderHistory();
    manageTick();
  }

  function renderHistory() {
    if (state.history.length === 0) {
      historyListEl.innerHTML = '<div class="history-empty">no recent sends</div>';
      return;
    }
    historyListEl.innerHTML = state.history.map(h => {
      const mode = h.mode === 'shopping' ? 'shopping' : 'habit';
      return `
        <div class="history-item">
          <div class="history-meta"><span class="mode-tag">${mode}</span> · ${formatHistoryTime(h.sentAt)}</div>
          <div class="history-text">${escapeHtml(h.text)}</div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- Tick ----------
  function manageTick() {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    if (currentPhase() !== 'holding') return;
    tickHandle = setInterval(() => {
      const t = state.timer[currentMode];
      if (!t) { render(); return; }
      const remaining = HOLD_MS - (Date.now() - t.startedAt);
      if (remaining <= 0) {
        clearInterval(tickHandle);
        tickHandle = null;
        render(); // transitions to 'ready'
        return;
      }
      timerDisplayEl.textContent = formatRemaining(remaining);
    }, 1000);
  }

  // ---------- Actions ----------
  function startHold() {
    const text = textareaEl.value.trim();
    if (!text) return;
    state.timer[currentMode] = { startedAt: Date.now(), text };
    state.draft[currentMode] = '';
    saveState();
    render();
  }

  function cancelHold() {
    const t = state.timer[currentMode];
    if (!t) return;
    if (!confirm('20分待機をキャンセルします。テキストは下書きに戻ります。OK?')) return;
    state.draft[currentMode] = t.text;
    state.timer[currentMode] = null;
    saveState();
    render();
  }

  function discard() {
    if (!confirm('このログを破棄します。OK?')) return;
    state.timer[currentMode] = null;
    state.draft[currentMode] = '';
    saveState();
    render();
  }

  function clearDraft() {
    state.draft[currentMode] = '';
    saveState();
    render();
  }

  function send() {
    const t = state.timer[currentMode];
    const text = textareaEl.value.trim();
    if (!t || !text) return;

    const cfg = MODE_CONFIG[currentMode];
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const bullets = lines.map(l => `- ${l}`).join('\n');
    const data = encodeURIComponent('\n' + bullets);
    const filepath = encodeURIComponent('Dailynote/' + getToday());
    const heading = encodeURIComponent(cfg.heading);
    const uri = `obsidian://advanced-uri?vault=${encodeURIComponent(VAULT)}&filepath=${filepath}&heading=${heading}&data=${data}&mode=append`;

    state.history.unshift({ mode: currentMode, text, sentAt: Date.now() });
    state.history = state.history.slice(0, HISTORY_MAX);
    state.timer[currentMode] = null;
    state.draft[currentMode] = '';
    saveState();

    showToast('Opening Obsidian…');
    window.location.href = uri;
    setTimeout(render, 300);
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ---------- Events ----------
  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const next = btn.dataset.mode;
      if (next === currentMode) return;
      // persist current draft before switch
      if (currentPhase() === 'idle') {
        state.draft[currentMode] = textareaEl.value;
      }
      currentMode = next;
      state.lastMode = next;
      saveState();
      render();
    });
  });

  textareaEl.addEventListener('input', () => {
    const phase = currentPhase();
    if (phase === 'idle') {
      state.draft[currentMode] = textareaEl.value;
      saveState();
      primaryBtnEl.disabled = !textareaEl.value.trim();
      secondaryBtnEl.style.display = textareaEl.value.trim() ? 'block' : 'none';
    } else if (phase === 'ready') {
      state.timer[currentMode].text = textareaEl.value;
      saveState();
      primaryBtnEl.disabled = !textareaEl.value.trim();
    }
  });

  primaryBtnEl.addEventListener('click', () => {
    const action = primaryBtnEl.dataset.action;
    if (action === 'start') startHold();
    else if (action === 'send') send();
  });

  secondaryBtnEl.addEventListener('click', () => {
    const action = secondaryBtnEl.dataset.action;
    if (action === 'clear') clearDraft();
    else if (action === 'cancel') cancelHold();
    else if (action === 'discard') discard();
  });

  // Re-render when tab becomes visible again (timer may have completed)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) render();
  });

  // ---------- Init ----------
  render();
</script>
</body>
</html>
